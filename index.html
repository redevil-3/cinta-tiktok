
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
}

.ticker {
  width: 100vw;
  height: 100px;
  position: relative;
  overflow: hidden;
  background: transparent;
}

.ticker-text {
  position: absolute;
  top: 50%;
  left: 100%;
  transform: translateY(-50%);
  white-space: nowrap;

  font-family: Arial, sans-serif;
  font-size: 42px;
  font-weight: 700;
  color: white;

  text-shadow:
    2px 2px 3px black,
    -2px -2px 3px black,
    0 0 8px black;

  animation: tickerMove 20s linear infinite;
}

@keyframes tickerMove {
  from {
    left: 100%;
  }
  to {
    left: -1800px;
  }
}
</style>
</head>

<body>

<div class="ticker">
  <div class="ticker-text">
    🎵 LIVE DE MUSIQUE RETRO • TOP MUSIQUE INTERNATIONAL • BIENVENUE À TOUS LES AMIS • MERCI POUR VOS LIKES ET PARTAGES ❤️
  </div>
</div>

</body>
</html>
