<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.cinta 
    width: 100vw;
    height: 80px;
    overflow: hidden;
    white-space: nowrap;
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.55);
}

.texto {
    display: inline-block;
    padding-left: 100%;
    font-family: Arial, sans-serif;
    font-size: 38px;
    font-weight: bold;
    color: #fffff;
    text-shadow: 2px 2px 3px black;
    animation: pasar 24s linear infinite;
}

@keyframes pasar {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="cinta">
    <div class="texto">
        🎵 LIVE DE MUSIQUE RETRO • TOP MUSIQUE INTERNATIONAL • BIENVENUE À TOUS LES AMIS • MERCI POUR VOS LIKES ET PARTAGES ❤️
    </div>
</div>

</body>
</html>
